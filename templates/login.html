{% extends "base.html" %}
{% block content %}
  <h1>Log in</h1>
  <form method="post">
    <p>Email: <input type="email" name="email" required></p>
    <p>Password: <input type="password" name="password" required></p>
    <p><button type="submit">Log in</button></p>
  </form>
  <p>No account yet? <a href="{{ url_for('register') }}">Sign up</a></p>
{% endblock %}
